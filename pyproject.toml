[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-master"
version = "0.2.0"
description = "Universal, provider-neutral prompt engineering toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ashwinx0x"}]
dependencies = []

[project.scripts]
prompt-master = "prompt_master.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
